name: Review - Senior C# Developer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

concurrency:
  group: review-csharp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-csharp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Senior C# Developer review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          copilot --prompt "$(cat <<'PROMPT'
          You are acting as a Senior C# Developer reviewing this pull request (PR #${PR_NUMBER}) for a .NET solution.
          Review the full diff for: idiomatic C# usage, async/await correctness, null-safety, exception handling,
          resource disposal, testability, naming/readability, and adherence to .NET best practices. Do not comment on
          formatting handled by an IDE formatter/analyzer.

          Output your result as a single JSON object, and nothing else, matching exactly this schema:
          {
            "verdict": "APPROVE" | "REQUEST_CHANGES",
            "summary": "one paragraph overall assessment",
            "findings": [
              {"file": "path/to/file.cs", "line": 0, "severity": "blocking"|"warning"|"info", "comment": "explanation and suggested fix"}
            ]
          }
          Use REQUEST_CHANGES if there is at least one "blocking" finding. Write the JSON to review-output.json.
          PROMPT
          )" --allow-tool write --max-ai-credits 40

          cat review-output.json

      - name: Post review to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/post_persona_review.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --persona "Senior C# Developer" \
            --input review-output.json
